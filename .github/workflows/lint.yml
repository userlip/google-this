name: Lint

on: [push, pull_request]

jobs:
  eslint:
    name: Lint
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || fromJSON('["self-hosted","ci","github-actions"]') }}
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3

      - name: npm install and lint
        run: |
          npm install
          npm run lint